name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'totem/**'
      - 'buildozer.spec'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Inject API_URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          sed -i "s|https://totem-esg.up.railway.app|${API_URL}|g" totem/totem_app.py

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3.11 python3.11-venv python3.11-dev python3.11-distutils \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libltdl-dev

      - name: Create Python 3.11 venv and install Buildozer
        run: |
          python3.11 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Build APK
        run: |
          . .venv/bin/activate
          buildozer -v android debug

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          APK=$(find bin/ -name "*.apk" | head -1)
          echo "APK encontrado: $APK"
          APKSIGNER="$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/apksigner"
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out bin/totem-esg-signed.apk \
            "$APK"
          echo "APK assinado com sucesso"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: totem-esg-apk
          path: bin/totem-esg-signed.apk
          retention-days: 30
